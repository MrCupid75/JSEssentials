<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Health Analysis Data</title>
    <link rel="stylesheet" href="health_analysis.css" />
  </head>
  <body>
    <nav>
      <h1>Health</h1>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li>
          <input
            type="text"
            id="conditionInput"
            placeholder="Enter a health condition"
          />
        </li>
        <li><button id="btnsearch">Search</button></li>
      </ul>
    </nav>
    <div class="container">
      <div class="analysisForm">
        <h1>Health Data Analysis</h1>
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" />
        </div>
        <div>
          <label>Gender:</label>
          <label for="male">Male</label>
          <input type="radio" name="gender" id="male" value="Male" />
          <label for="female">Female</label>
          <input type="radio" name="gender" id="female" value="Female" />
        </div>
        <div>
          <label for="age">Age:</label>
          <input type="number" id="age" />
        </div>
        <div>
          <label for="condition">Conditions:</label>
          <select name="conditon" id="condition">
            <option value="">Select Conditon</option>
            <option value="Diabetes">Diabetes</option>
            <option value="Thyroid">Thyroid</option>
            <option value="High Blood Pressure">High Blood Pressure</option>
          </select>
        </div>
        <button id="addPatient">Add Patient</button>
        <h2>Analysis Report</h2>
        <div id="report"></div>
      </div>
      <div class="searchCondition">
        <div id="result"></div>
      </div>
    </div>
    <script src="health_analysis.js"></script>
  </body>
</html>
